[binaries]
c = ['/usr/bin/clang', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
cpp = ['/usr/bin/clang++', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
objc = ['/usr/bin/clang', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
objcpp = ['/usr/bin/clang++', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
ar = '/usr/bin/ar'
strip = '/usr/bin/strip'
pkg-config = '/usr/bin/false'

[host_machine]
system = 'darwin'
kernel = 'xnu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
